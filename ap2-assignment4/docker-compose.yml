version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:alpine
    ports:
      - "4222:4222"
