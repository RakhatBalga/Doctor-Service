syntax = "proto3";

package appointment.v1;

option go_package = "appointment-service/proto/appointmentpb;appointmentpb";

// AppointmentService manages medical appointments and their lifecycle.
service AppointmentService {
  rpc CreateAppointment(CreateAppointmentRequest) returns (AppointmentResponse);
  rpc GetAppointment(GetAppointmentRequest) returns (AppointmentResponse);
  rpc UpdateAppointmentStatus(UpdateAppointmentStatusRequest) returns (AppointmentResponse);
  rpc ListAppointments(ListAppointmentsRequest) returns (ListAppointmentsResponse);
}

message Appointment {
  string id = 1;
  string title = 2;
  string description = 3;
  string doctor_id = 4;
  string status = 5;
}

message CreateAppointmentRequest {
  string title = 1;
  string description = 2;
  string doctor_id = 3;
}

message GetAppointmentRequest {
  string id = 1;
}

message UpdateAppointmentStatusRequest {
  string id = 1;
  string status = 2;
}

message ListAppointmentsRequest {
  string doctor_id = 1; // optional filter
}

message AppointmentResponse {
  Appointment appointment = 1;
}

message ListAppointmentsResponse {
  repeated Appointment appointments = 1;
}
